name: Release

# Keeps a "release PR" up to date from the Conventional Commits on main.
# Merging that PR creates the vX.Y.Z tag and the GitHub Release with notes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A personal token lets CI run on the release PR (the default
          # GITHUB_TOKEN does not trigger workflows). Falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
